[project]
name = "quartermaster"
version = "0.0.0"
description = "A learn-by-building discord.py bot"
requires-python = ">=3.10"
dependencies = ["discord.py>=2.4", "python-dotenv>=1.0", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "day2: Day 2 - dice parser",
    "day3: Day 3 - embed helper",
    "day5: Day 5 - poll state",
    "day6: Day 6 - durations and reminder storage",
    "day7: Day 7 - automod rules",
]
